# The metronome's wrangler config. Deployed manually from the laptop
# (`npx wrangler deploy` in this directory) — CI never touches it.
# Cron minutes are :03 and :33, deliberately offset from the GitHub
# schedule's 2,17,32,47 so the two clocks rarely collide; when they
# do, the workflow's concurrency group settles it.
#
# One trigger, two jobs (10 Oct 2026): every tick dispatches the build,
# and from AGENDA_NOT_BEFORE (UTC, "HH:MM") onward each tick also starts
# Agenda watch, the nightly North Ayrshire collection, unless GitHub
# says it has already run today. A dedicated daily cron trigger was
# tried first and was skipped by Cloudflare, so the nightly rides on the
# half-hourly one and checks its own work. To prove the nightly path
# today rather than wait for 05:03, deploy once with the threshold at
# midnight —
#   npx wrangler deploy --var AGENDA_NOT_BEFORE:00:00
# — watch the next tick dispatch both, then `npx wrangler deploy` with
# no --var to restore the value below.

name = "largs-metronome"
main = "metronome.js"
compatibility_date = "2026-08-01"
workers_dev = false

[vars]
AGENDA_NOT_BEFORE = "05:00"

# Workers Logs: every tick's console lines and any exception, in the
# dashboard under the Worker's Observability tab for three days. 48
# invocations a day is nothing against the free allowance.
[observability]
enabled = true

[triggers]
crons = ["3,33 * * * *"]
