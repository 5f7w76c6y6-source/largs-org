# Rebuilds and deploys the site:
#   - every half hour (so the "Largs today" board stays fresh)
#   - on every push to main
#   - on demand, from the Actions tab ("Run workflow")
#
# Deploys by DIRECT UPLOAD to Cloudflare Pages (wrangler pages deploy),
# not Cloudflare's own git-connected build system. That matters: direct
# uploads don't count against Cloudflare's 500-builds-per-month free
# quota, and this schedule alone is ~1,450 builds a month. GitHub
# Actions minutes are free and unlimited on public repositories, which
# is why this repo should stay public.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — custom token with "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  — shown in the Cloudflare dashboard sidebar
# Optional:
#   ADMIRALTY_KEY          — UK Tidal API (Discovery) subscription key.
#                            Absent = tides come from the ocean model.
#                            Setting it is the go-live switch for UKHO
#                            tides — only after their written OK for
#                            the bake-and-display pattern.
#
# Two GitHub quirks worth knowing:
#   - Jobs scheduled on the hour queue behind everyone else's; the odd
#     minutes below (:17 and :47) run noticeably more reliably.
#   - GitHub disables scheduled workflows after 60 days without repo
#     activity. If the Today board goes stale, check the Actions tab —
#     one click re-enables it (or any small commit resets the clock).

name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "2,17,32,47 * * * *"

# Never let two deploys overlap; a newer run supersedes an older one.
concurrency:
  group: build-and-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci = clean, reproducible install from package-lock.json
      # (think: resolving from Package.resolved rather than Package.swift).
      # It fails hard if the lockfile is missing — run `npm install`
      # locally once and commit the lockfile before the first push.
      - run: npm ci

      # SRWR roadworks: the register publishes ~90 MB of monthly archives
      # that change once a day. This cache carries a few-KB distillate of
      # "current Largs works" between runs, so only the first build after
      # each overnight publication does the heavy pull; the other ~95
      # builds a day reuse it. The key is always-new so every run saves;
      # restore-keys pulls the most recent previous save.
      - name: Cache SRWR roadworks state
        uses: actions/cache@v4
        with:
          path: .cache
          key: srwr-state-${{ github.run_id }}
          restore-keys: |
            srwr-state-

      - name: Fetch live data
        run: node scripts/fetch-data.mjs
        env:
          ADMIRALTY_KEY: ${{ secrets.ADMIRALTY_KEY }}

      # Fuel: the cron Worker (worker/fuel) keeps a snapshot of the 26
      # forecourts in R2, refreshed every five minutes. Pull it here so the
      # page's DIRECTORY -- names, places, which grades each forecourt sells
      # -- is rebuilt from the live register rather than a frozen file.
      #
      # The PRICES are deliberately not baked. This workflow runs every
      # fifteen minutes, and Fuel Finder's fair use policy asks that what is
      # shown to the public not differ materially from the register. A price
      # baked at :02 and served at :16 does differ. So the page ships without
      # prices and fetches them from /api/fuel while someone is looking.
      #
      # Pulled from R2 with a credential rather than over HTTP on purpose:
      # a public endpoint serving the register's own records would be
      # redistributing raw API data, which the developer guidelines ask
      # integrators not to do. /api/fuel emits prices only, in our shape.
      #
      # continue-on-error: a token without R2 read, or an R2 outage, must
      # never fail the deploy. The committed src/_data/fuel.json stands in
      # and the page says honestly how old it is. That also means this fails
      # QUIETLY -- check the run log after the first run rather than assuming.
      - name: Fetch fuel snapshot from R2
        id: fuel_snapshot
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pinned. wrangler-action installs 3.90.0 by default, which has
          # no --remote flag -- that arrived in wrangler 4, and without it
          # this step fails and the build silently falls back to the
          # committed fuel.json. Caught 23 Aug on the first run.
          wranglerVersion: "4.125.0"
          preCommands: mkdir -p .cache
          command: r2 object get largs-fuel/corridor.json --file .cache/corridor.json --remote

      - name: Distil fuel directory
        if: steps.fuel_snapshot.outcome == 'success'
        run: python3 scripts/make-fuel.py .cache/corridor.json src/_data/fuel.json

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=largs-org
