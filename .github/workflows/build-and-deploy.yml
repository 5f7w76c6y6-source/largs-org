# Rebuilds and deploys the site:
#   - every half hour (so the "Largs today" board stays fresh)
#   - on every push to main
#   - on demand, from the Actions tab ("Run workflow")
#
# Deploys by DIRECT UPLOAD to Cloudflare Pages (wrangler pages deploy),
# not Cloudflare's own git-connected build system. That matters: direct
# uploads don't count against Cloudflare's 500-builds-per-month free
# quota, and this schedule alone is ~1,450 builds a month. GitHub
# Actions minutes are free and unlimited on public repositories, which
# is why this repo should stay public.
#
# There is a SECOND, TEMPORARY deploy at the end of this file, to
# largs-preview.pages.dev. See the block above it. It retires itself.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — custom token with "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  — shown in the Cloudflare dashboard sidebar
# Optional:
#   ADMIRALTY_KEY          — UK Tidal API (Discovery) subscription key.
#                            Absent = tides come from the ocean model.
#                            Setting it is the go-live switch for UKHO
#                            tides — only after their written OK for
#                            the bake-and-display pattern.
#
# Two GitHub quirks worth knowing:
#   - Jobs scheduled on the hour queue behind everyone else's; the odd
#     minutes below (:17 and :47) run noticeably more reliably.
#   - GitHub disables scheduled workflows after 60 days without repo
#     activity. If the Today board goes stale, check the Actions tab —
#     one click re-enables it (or any small commit resets the clock).

name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "2,17,32,47 * * * *"

# Never let two deploys overlap; a newer run supersedes an older one.
concurrency:
  group: build-and-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci = clean, reproducible install from package-lock.json
      # (think: resolving from Package.resolved rather than Package.swift).
      # It fails hard if the lockfile is missing — run `npm install`
      # locally once and commit the lockfile before the first push.
      - run: npm ci

      # SRWR roadworks: the register publishes ~90 MB of monthly archives
      # that change once a day. This cache carries a few-KB distillate of
      # "current Largs works" between runs, so only the first build after
      # each overnight publication does the heavy pull; the other ~95
      # builds a day reuse it. The key is always-new so every run saves;
      # restore-keys pulls the most recent previous save.
      - name: Cache SRWR roadworks state
        uses: actions/cache@v4
        with:
          path: .cache
          key: srwr-state-${{ github.run_id }}
          restore-keys: |
            srwr-state-

      - name: Fetch live data
        run: node scripts/fetch-data.mjs
        env:
          ADMIRALTY_KEY: ${{ secrets.ADMIRALTY_KEY }}

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=largs-org

      # ─────────────────────────────────────────────────────────────
      # TEMPORARY: preview mirror for Largs Community Council
      #
      # largs-preview.pages.dev is a neutral hostname, so the site can
      # be shown to the Community Council without "largs-org" giving
      # away the domain intention. It serves the identical _site build,
      # so X-Robots-Tag: noindex travels with it automatically.
      #
      # REMOVE THIS WHOLE BLOCK, and delete the Cloudflare Pages
      # project, once the Community Council conversation has happened.
      #
      # It retires itself so a forgotten second copy cannot quietly
      # outlive its purpose: past PREVIEW_UNTIL the deploy stops
      # running and the Actions run log carries a notice saying so.
      # Extending that date should be a decision, not a reflex.
      #
      # continue-on-error means a preview failure can never block or
      # fail the real deploy above — which also means it fails QUIETLY.
      # Check the run log after the first run rather than assuming.
      # ─────────────────────────────────────────────────────────────
      - name: Preview mirror window
        id: preview_window
        env:
          PREVIEW_UNTIL: "20260930"   # ← the only line to change
        run: |
          today="$(date -u +%Y%m%d)"
          if [ "$today" -le "$PREVIEW_UNTIL" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Preview mirror expired::largs-preview is no longer being updated. Delete the Cloudflare Pages project and remove this block from .github/workflows/build-and-deploy.yml"
          fi

      - name: Deploy preview mirror (temporary)
        if: steps.preview_window.outputs.active == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=largs-preview
